# An example policy: a letting agency's repairs desk. Replace it with the event's track.
#
# How to read it: a case starts in NEW. Rules with no `on:` run by themselves, top to bottom,
# the first true one each time. Rules with `on:` answer the agent's signals (its tools). The
# agent never writes a field: functions and the classifier do. A case ends in a `final:` state,
# and that state is the answer.

policy: repairs-desk
version: 1
description: >
  A letting agency's maintenance inbox. Tenants report repairs and ask questions; the desk books
  an approved contractor when the landlord's spending limit allows it, answers simple questions,
  and hands everything else to a person with the facts attached.

fields:
  tenant:       { type: text,  description: the tenancy the sender is on }
  landlord:     { type: text,  description: the property's landlord }
  limit:        { type: money, description: what the landlord lets us spend without asking }
  is_emergency: bool
  category:     enum [repair, question, payment, complaint, other]
  trade:        enum [plumbing, electrical, heating, locks, other]
  contractor:   text
  quote:        money
  booked:       bool
  reason:       enum [EMERGENCY, UNKNOWN_SENDER, UNCLEAR, OVER_LIMIT, NO_CONTRACTOR, ACTION_FAILED, AGENT_ESCALATED, NOT_HANDLED]

states: [NEW, IDENTIFIED, TRIAGED, QUOTED, DONE, ANSWERED, ESCALATED]
initial: NEW
final:
  DONE: act
  ANSWERED: act
  ESCALATED: escalate

signals:
  book_repair:
    description: >
      Book a contractor for a repair the tenant reported. The desk finds the landlord's approved
      contractor for the trade, gets a quote, and books only within the landlord's limit;
      otherwise the case goes to a person. Use it once per case, for a repair only.
    args:
      trade: { type: enum, values: [plumbing, electrical, heating, locks, other], description: the kind of work }
      access: { type: text, description: "when the tenant said they can let the contractor in, in their words" }
  reply:
    description: >
      Answer a tenant's question from the tenancy record: the desk writes the reply from the record,
      so pick what the question is about. Not for repairs, money or complaints.
    args:
      about: { type: enum, values: [rent_due_date, rent_amount, landlord, property], description: what the tenant asked }
  escalate:
    description: >
      Hand the case to a person now. Use it when the case is outside what the other tools do,
      when facts conflict, or when you are not sure. Say what a person needs to know.
    args:
      note: { type: text, description: "what happened and what is still open, for the person" }

triggers:
  # --- who wrote? Facts come from the records, not from the message.
  - name: identify
    when: "state = NEW"
    call: find_sender
    to: IDENTIFIED

  - name: unknown-sender
    when: "state = IDENTIFIED and tenant absent"
    set: { reason: UNKNOWN_SENDER }
    to: ESCALATED

  # --- what is it about? One classifier call answers all three.
  - name: triage
    when: "state = IDENTIFIED and tenant present"
    ask:
      is_emergency:
        noul: "Is anyone or the property in immediate danger: gas smell, fire, flooding, sparks, no heat for a vulnerable person?"
        above: 0.7
        below: 0.3
      category:
        choice: "What is the message mainly about?"
        options:
          repair: something in the home is broken or not working
          question: a question about the tenancy (rent, dates, contacts)
          payment: a payment, refund, deposit or money owed
          complaint: a complaint about the agency, a neighbour or a person
          other: anything else
      trade:
        choice: "If it is a repair, which trade does it need?"
        options:
          plumbing: taps, pipes, leaks, toilets, drains
          electrical: sockets, lights, fuses, wiring
          heating: boiler, radiators, hot water
          locks: locks, doors, keys, windows
          other: any other repair
    retry: 1
    to: TRIAGED

  - name: emergency
    when: "state = TRIAGED and is_emergency"
    set: { reason: EMERGENCY }
    to: ESCALATED

  - name: emergency-unclear
    when: "state = TRIAGED and is_emergency absent"
    note: The classifier was not sure either way; danger is not guessed.
    set: { reason: UNCLEAR }
    to: ESCALATED

  # --- a repair: quote first, then book only within the landlord's limit.
  - name: quote-repair
    on: book_repair
    # The agent's trade must agree with the classifier's: a disagreement is refused, with both values.
    when: "state = TRIAGED and category = repair and not is_emergency and args.trade = trade"
    call: get_quote
    to: QUOTED

  - name: no-contractor
    when: "state = QUOTED and contractor absent"
    set: { reason: NO_CONTRACTOR }
    to: ESCALATED

  - name: over-limit
    when: "state = QUOTED and quote > limit"
    set: { reason: OVER_LIMIT }
    to: ESCALATED

  - name: book
    when: "state = QUOTED and quote <= limit"
    call: book_contractor
    retry: 2
    to: DONE

  # --- a question the record answers.
  - name: answer-question
    on: reply
    when: "state = TRIAGED and category = question"
    call: send_reply
    to: ANSWERED

  # --- the agent hands over.
  - name: agent-escalates
    on: escalate
    when: "state != ESCALATED"
    set: { reason: AGENT_ESCALATED }
    to: ESCALATED

on_error:
  set: { reason: ACTION_FAILED }
  to: ESCALATED

on_stall:
  set: { reason: NOT_HANDLED }
  to: ESCALATED

briefing: brief

agent:
  model: claude-sonnet-5-5
  max_turns: 8
