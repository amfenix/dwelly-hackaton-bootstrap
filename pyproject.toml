[project]
name = "desk"
version = "0.1.0"
description = "Cases in, decisions out: an agent whose actions run through a declarative policy."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.4",
]

[project.scripts]
desk = "desk.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=desk --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = ["*/desk/__main__.py"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/desk", "track/functions.py"]
